# AWS traffic host mesh — generated by aws-lab-probe-gen-config.sh
agent_id: aws-traffic-host
region: us-east-1
interval_sec: 30

targets:
  - name: nlb-internal
    kind: tcp
    host: network-o11y-demo-dash-nlb-6af096fd4d14db64.elb.us-east-1.amazonaws.com
    port: 8080
    type: nlb
    direction: aws_to_aws
  - name: alb-akc
    url: http://AKC-ALB-1036936801.us-east-1.elb.amazonaws.com/
    type: alb
    direction: aws_to_aws
  - name: internet-egress-nat
    url: https://aws.amazon.com/
    type: nat_path
    direction: aws_to_internet
  # Uncomment and set your laptop's reachable URL (public IP:port or tunnel):
  # - name: laptop-callback
  #   url: http://YOUR_PUBLIC_IP:18080/health
  #   type: laptop
  #   direction: aws_to_laptop
