trap:
  listen: 127.0.0.1:1620
  community: hello
  version: ""
  transport: ""
  v3_config: null
  trap_only: false
  drop_undefined: false
  endpoint: ""
  endpoint_port: 0
discovery:
  cidrs: []
  ignore_list: []
  debug: false
  ports:
    - 161
  default_communities:
    - public
  use_snmp_v1: false
  default_v3: null
  add_devices: false
  add_mibs: true
  threads: 4
  replace_devices: false
  kentik: null
  no_use_bulkwalkall: false
global:
  poll_time_sec: 60
  drop_if_outside_poll: false
  timeout_ms: 15000
  retries: 2
  user_tags:
    snmp_group: campus
    lab: workshop
