# Alloy SNMP composite recording rules.
# Source of truth is provision-alloy-snmp-recording-rules.py (this file is exported).
# Human catalog: docs/alloy-network-fork.md § Computed metrics (recording rules).
#
# Packet counters and interface errors are cold-tier scrapes — not a 60s problem.
# Error rates and error % are recorded at 5m. Octets / link util stay at 1m.
#
# Load via Grafana-managed recording rules:
#   python3 local/scripts/provision-alloy-snmp-recording-rules.py

groups:
  - name: alloy-snmp.composites
    interval: 1m
    rules:
      - record: device:snmp_MemoryUtilization:percent
        # Alloy SNMP memory utilization %
        expr: |
          max by (instance, device_name, job, snmp_group) (
            snmp_cseSysMemoryUtilization{job="alloy-snmp"} or snmp_wlsxSysExtMemoryUsedPercent{job="alloy-snmp"} or snmp_perCentMemoryUtilization{job="alloy-snmp"} or snmp_tpSysMonitorMemoryUtilization{job="alloy-snmp"} or snmp_sfosMemoryPercentUsage{job="alloy-snmp"} or snmp_jnxOperatingBuffer{job="alloy-snmp"} or snmp_hwEntityMemUsage{job="alloy-snmp"} or snmp_hh3cEntityExtMemUsage{job="alloy-snmp"} or snmp_ramUtilization{job="alloy-snmp"} or snmp_swMemUsage{job="alloy-snmp"} or snmp_genMemUtilizationPercentUsed{job="alloy-snmp"} or snmp_iveMemoryUtil{job="alloy-snmp"} or snmp_sonicCurrentRAMUtil{job="alloy-snmp"} or snmp_chStackUnitMemUsageUtil{job="alloy-snmp"} or snmp_ibSystemMonitorMemUsage{job="alloy-snmp"} or snmp_sysMgmtMemUsage{job="alloy-snmp"}
          )
          or
          max by (instance, device_name, job, snmp_group) (

                        100 * snmp_MemoryUsed{job="alloy-snmp"} / (snmp_MemoryUsed{job="alloy-snmp"} + snmp_MemoryFree{job="alloy-snmp"})
                      or
                        100 * (snmp_MemoryTotal{job="alloy-snmp"} - snmp_MemoryFree{job="alloy-snmp"}) / snmp_MemoryTotal{job="alloy-snmp"}
                      or
                        100 * snmp_MemoryUsed{job="alloy-snmp"} / snmp_MemoryTotal{job="alloy-snmp"}

          )

      - record: if:snmp_ifHCInOctets:rate5m
        # Alloy SNMP ifHCInOctets rate
        expr: |
          rate(snmp_ifHCInOctets{job="alloy-snmp"}[5m])

      - record: if:snmp_ifHCOutOctets:rate5m
        # Alloy SNMP ifHCOutOctets rate
        expr: |
          rate(snmp_ifHCOutOctets{job="alloy-snmp"}[5m])

      - record: if:snmp_IfInUtilization:percent
        # Alloy SNMP IfInUtilization %
        expr: |
          100 * rate(snmp_ifHCInOctets{job="alloy-snmp"}[5m]) * 8
            / on(instance, device_name, job, snmp_group, ifIndex, if_interface_name) group_left()
              ((snmp_ifHighSpeed{job="alloy-snmp"} > 0) * 1e6)

      - record: if:snmp_IfOutUtilization:percent
        # Alloy SNMP IfOutUtilization %
        expr: |
          100 * rate(snmp_ifHCOutOctets{job="alloy-snmp"}[5m]) * 8
            / on(instance, device_name, job, snmp_group, ifIndex, if_interface_name) group_left()
              ((snmp_ifHighSpeed{job="alloy-snmp"} > 0) * 1e6)

  - name: alloy-snmp.composites.cold
    interval: 5m
    rules:
      - record: if:snmp_ifInErrors:rate5m
        # Alloy SNMP ifInErrors rate
        expr: |
          rate(snmp_ifInErrors{job="alloy-snmp"}[15m])

      - record: if:snmp_ifOutErrors:rate5m
        # Alloy SNMP ifOutErrors rate
        expr: |
          rate(snmp_ifOutErrors{job="alloy-snmp"}[15m])

      - record: if:snmp_ifInErrorPercent:percent
        # Alloy SNMP ifInErrorPercent
        expr: |
          (
            100 * rate(snmp_ifInErrors{job="alloy-snmp"}[15m])
              / on(device_name, job, snmp_group, ifIndex, if_interface_name) group_left()
                rate(snmp_ifHCInUcastPkts{job="alloy-snmp"}[15m])
          )
          and on(device_name, job, snmp_group, ifIndex, if_interface_name)
            (rate(snmp_ifHCInUcastPkts{job="alloy-snmp"}[15m]) > 0)

      - record: if:snmp_ifOutErrorPercent:percent
        # Alloy SNMP ifOutErrorPercent
        expr: |
          (
            100 * rate(snmp_ifOutErrors{job="alloy-snmp"}[15m])
              / on(device_name, job, snmp_group, ifIndex, if_interface_name) group_left()
                rate(snmp_ifHCOutUcastPkts{job="alloy-snmp"}[15m])
          )
          and on(device_name, job, snmp_group, ifIndex, if_interface_name)
            (rate(snmp_ifHCOutUcastPkts{job="alloy-snmp"}[15m]) > 0)
