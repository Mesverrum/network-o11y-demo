# Nokia SR Linux — TIMETRA-BGP peer tables.
# NOT scraped by default. Neighbor drop/flap alerting is SNMP traps / syslog;
# a 60s or 5m poll is too slow to be useful. Keep this module for optional
# prefix-count experiments, not for session-state alerting.
modules:
  nokia_srlinux_bgp:
    walk:
    - 1.3.6.1.4.1.6527.3.1.2.14.4.7
    - 1.3.6.1.4.1.6527.3.1.2.14.4.8
    metrics:
    - name: snmp_tBgpPeerNgConnState
      oid: 1.3.6.1.4.1.6527.3.1.2.14.4.7.1.59
      type: gauge
      help: tBgpPeerNgConnState (TIMETRA-BGP-MIB) - 1.3.6.1.4.1.6527.3.1.2.14.4.7.1.59
      indexes:
      - labelname: tBgpPeerNgInstanceIndex
        type: gauge
      - labelname: tBgpPeerNgAddressType
        type: InetAddressType
      - labelname: tBgpPeerNgAddress
        type: InetAddress
      lookups:
      - labels: &id004
        - tBgpPeerNgInstanceIndex
        - tBgpPeerNgAddressType
        - tBgpPeerNgAddress
        labelname: peer_group
        oid: 1.3.6.1.4.1.6527.3.1.2.14.4.7.1.4
        type: DisplayString
      - labels: &id005
        - tBgpPeerNgInstanceIndex
        - tBgpPeerNgAddressType
        - tBgpPeerNgAddress
        labelname: peer_description
        oid: 1.3.6.1.4.1.6527.3.1.2.14.4.7.1.7
        type: DisplayString
      - labels: &id006
        - tBgpPeerNgInstanceIndex
        - tBgpPeerNgAddressType
        - tBgpPeerNgAddress
        labelname: local_as
        oid: 1.3.6.1.4.1.6527.3.1.2.14.4.7.1.65
        type: gauge
      - labels: &id007
        - tBgpPeerNgInstanceIndex
        - tBgpPeerNgAddressType
        - tBgpPeerNgAddress
        labelname: peer_as
        oid: 1.3.6.1.4.1.6527.3.1.2.14.4.7.1.66
        type: gauge
      enum_values:
        1: idle
        2: connect
        3: active
        4: opensent
        5: openconfirm
        6: established
    - name: snmp_tBgpPeerNgOperStatus
      oid: 1.3.6.1.4.1.6527.3.1.2.14.4.7.1.42
