# Nokia SR Linux — chassis / thermal / PSU (alerting; 60s hot).
# CPU/mem GETs: nokia_srlinux_hot. TIMETRA-BGP walks: nokia_srlinux_bgp (5m budget).
# SNMPv2 identity is inlined here (not a sibling system_mib scrape).
modules:
  nokia_srlinux:
    walk:
    - 1.3.6.1.4.1.6527.3.1.2.2.1.8
    - 1.3.6.1.4.1.6527.3.1.2.2.1.24.1
    - 1.3.6.1.4.1.6527.3.1.2.2.1.24.9
    get:
    - 1.3.6.1.2.1.1.1.0
    - 1.3.6.1.2.1.1.2.0
    - 1.3.6.1.2.1.1.3.0
    - 1.3.6.1.2.1.1.4.0
    - 1.3.6.1.2.1.1.5.0
    - 1.3.6.1.2.1.1.6.0
    metrics:
    - name: snmp_Uptime
      oid: 1.3.6.1.2.1.1.3
      type: gauge
      help: sysUpTime (SNMPv2-MIB) TimeTicks — same stem as kentik_snmp_Uptime
    - name: snmp_device_info
      oid: 1.3.6.1.2.1.1.5
      type: DisplayString
      help: Device identity (info metric, value 1). sysName is the DisplayString; SNMPv2 scalars are lookups.
      indexes:
      - labelname: snmp_scalar_index
        type: gauge
      lookups:
      - labels:
        - snmp_scalar_index
        labelname: sysDescr
        oid: 1.3.6.1.2.1.1.1
        type: DisplayString
      - labels:
        - snmp_scalar_index
        labelname: sysObjectID
        oid: 1.3.6.1.2.1.1.2
        type: DisplayString
      - labels:
        - snmp_scalar_index
        labelname: sysContact
        oid: 1.3.6.1.2.1.1.4
        type: DisplayString
      - labels:
        - snmp_scalar_index
        labelname: sysLocation
        oid: 1.3.6.1.2.1.1.6
        type: DisplayString
    - name: snmp_tmnxHwOperState
      oid: 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.16
      type: gauge
      help: tmnxHwOperState (TIMETRA-CHASSIS-MIB) - 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.16
      indexes:
      - labelname: tmnxChassisIndex
        type: gauge
      - labelname: tmnxHwIndex
        type: gauge
      lookups:
      - labels: &id001
        - tmnxChassisIndex
        - tmnxHwIndex
        labelname: hw_name
        oid: 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.8
        type: DisplayString
      - labels: &id002
        - tmnxChassisIndex
        - tmnxHwIndex
        labelname: hw_serial
        oid: 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.5
        type: DisplayString
      - labels: &id003
        - tmnxChassisIndex
        - tmnxHwIndex
        labelname: hw_class
        oid: 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.7
        type: DisplayString
      enum_values:
        1: unknown
        2: inService
        3: outOfService
        4: diagnosing
        5: failed
        6: booting
        7: empty
        8: provisioned
        9: unprovisioned
        10: upgrade
        11: downgrade
        12: inServiceUpgrade
        13: inServiceDowngrade
        14: resetPending
    - name: snmp_Temperature
      oid: 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.18
      type: gauge
      help: tmnxHwTemperature (TIMETRA-CHASSIS-MIB) - 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.18
      indexes:
      - labelname: tmnxChassisIndex
        type: gauge
      - labelname: tmnxHwIndex
        type: gauge
      lookups:
      - labels: *id001
        labelname: hw_name
        oid: 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.8
        type: DisplayString
      - labels: *id002
        labelname: hw_serial
        oid: 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.5
        type: DisplayString
      - labels: *id003
        labelname: hw_class
        oid: 1.3.6.1.4.1.6527.3.1.2.2.1.8.1.7
        type: DisplayString
    - name: snmp_tmnxPhysChassisFanOperStatus
      oid: 1.3.6.1.4.1.6527.3.1.2.2.1.24.1.1.2
      type: gauge
      help: tmnxPhysChassisFanOperStatus (TIMETRA-CHASSIS-MIB) - 1.3.6.1.4.1.6527.3.1.2.2.1.24.1.1.2
      indexes:
      - labelname: tmnxPhysChassisClass
        type: gauge
      - labelname: tmnxPhysChassisNum
        type: gauge
      - labelname: tmnxPhysChassisFanIndex
        type: gauge
      enum_values:
        1: unknown
        2: deviceStateInService
        3: deviceStateOutOfService
        4: deviceStateDiagnosing
        5: deviceStateFailed
        6: deviceStateBooting
        7: deviceStateEmpty
    - name: snmp_tmnxPhysChassisPMOutputStatus
      oid: 1.3.6.1.4.1.6527.3.1.2.2.1.24.9.1.7
      type: gauge
      help: tmnxPhysChassisPMOutputStatus (TIMETRA-CHASSIS-MIB) - 1.3.6.1.4.1.6527.3.1.2.2.1.24.9.1.7
      indexes:
      - labelname: tmnxPhysChassisPMIndex
        type: gauge
      enum_values:
        1: unknown
        2: online
        3: notEquipped
        4: failed
        5: outOfService
        6: degraded
