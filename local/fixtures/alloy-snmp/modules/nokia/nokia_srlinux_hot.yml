# Nokia SR Linux — 60s alerting scalars (TIMETRA-SYSTEM-MIB GETs).
# Chassis walks live in nokia_srlinux; bulky BGP walks in nokia_srlinux_bgp.
modules:
  nokia_srlinux_hot:
    get:
    - 1.3.6.1.4.1.6527.3.1.2.1.1.1.0
    - 1.3.6.1.4.1.6527.3.1.2.1.1.9.0
    - 1.3.6.1.4.1.6527.3.1.2.1.1.10.0
    metrics:
    - name: snmp_CPU
      oid: 1.3.6.1.4.1.6527.3.1.2.1.1.1
      type: gauge
      help: sgiCpuUsage (TIMETRA-SYSTEM-MIB) - 1.3.6.1.4.1.6527.3.1.2.1.1.1.0
    - name: snmp_MemoryUsed
      oid: 1.3.6.1.4.1.6527.3.1.2.1.1.9
      type: gauge
      help: sgiKbMemoryUsed (TIMETRA-SYSTEM-MIB) - 1.3.6.1.4.1.6527.3.1.2.1.1.9.0
    - name: snmp_MemoryFree
      oid: 1.3.6.1.4.1.6527.3.1.2.1.1.10
      type: gauge
      help: sgiKbMemoryAvailable (TIMETRA-SYSTEM-MIB) - 1.3.6.1.4.1.6527.3.1.2.1.1.10.0
