# Unknown sysObjectID — SNMPv2 identity only (replaces kentik system-mib.yml).
# Vendor fingerprint modules inline this same template plus their 1:1 scalars.
modules:
  device_base:
    get:
    - 1.3.6.1.2.1.1.1.0
    - 1.3.6.1.2.1.1.2.0
    - 1.3.6.1.2.1.1.3.0
    - 1.3.6.1.2.1.1.4.0
    - 1.3.6.1.2.1.1.5.0
    - 1.3.6.1.2.1.1.6.0
    metrics:
    - name: snmp_Uptime
      oid: 1.3.6.1.2.1.1.3
      type: gauge
      help: sysUpTime (SNMPv2-MIB) TimeTicks — same stem as kentik_snmp_Uptime
    - name: snmp_device_info
      oid: 1.3.6.1.2.1.1.5
      type: DisplayString
      help: Device identity (info metric, value 1). Dummy snmp_scalar_index (.0) is required.
      indexes:
      - labelname: snmp_scalar_index
        type: gauge
      lookups:
      - labels:
        - snmp_scalar_index
        labelname: sysDescr
        oid: 1.3.6.1.2.1.1.1
        type: DisplayString
      - labels:
        - snmp_scalar_index
        labelname: sysObjectID
        oid: 1.3.6.1.2.1.1.2
        type: DisplayString
      - labels:
        - snmp_scalar_index
        labelname: sysContact
        oid: 1.3.6.1.2.1.1.4
        type: DisplayString
      - labels:
        - snmp_scalar_index
        labelname: sysLocation
        oid: 1.3.6.1.2.1.1.6
        type: DisplayString
