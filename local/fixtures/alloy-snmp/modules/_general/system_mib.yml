# OBSOLETE — identity is inlined on fingerprint modules / device_base.
# Do not scrape this alongside a vendor module (two snmp_device_info families collide).
# SNMPv2-MIB system group — Prometheus info pattern.
# snmp_device_info is always 1; identity strings are labels.
# snmp_exporter skips lookups with labels: [] (see collector indexesToLabels).
# Scalars use instance .0 as a dummy index so lookups resolve, then Alloy drops it.
# DisplayString names the sysName label after the metric; Alloy copies it to sysName.
# snmp_Uptime stays a separate TimeTicks gauge (do not hang metadata on it).
modules:
  system_mib:
    get:
    - 1.3.6.1.2.1.1.1.0
    - 1.3.6.1.2.1.1.2.0
    - 1.3.6.1.2.1.1.3.0
    - 1.3.6.1.2.1.1.4.0
    - 1.3.6.1.2.1.1.5.0
    - 1.3.6.1.2.1.1.6.0
    metrics:
    - name: snmp_Uptime
      oid: 1.3.6.1.2.1.1.3
      type: gauge
      help: sysUpTime (SNMPv2-MIB) TimeTicks — same stem as kentik_snmp_Uptime
    - name: snmp_device_info
      oid: 1.3.6.1.2.1.1.5
      type: DisplayString
      help: SNMPv2-MIB device identity (info metric, value 1)
      indexes:
      - labelname: snmp_scalar_index
        type: gauge
      lookups:
      - labels:
        - snmp_scalar_index
        labelname: sysDescr
        oid: 1.3.6.1.2.1.1.1
        type: DisplayString
      - labels:
        - snmp_scalar_index
        labelname: sysObjectID
        oid: 1.3.6.1.2.1.1.2
        type: DisplayString
      - labels:
        - snmp_scalar_index
        labelname: sysContact
        oid: 1.3.6.1.2.1.1.4
        type: DisplayString
      - labels:
        - snmp_scalar_index
        labelname: sysLocation
        oid: 1.3.6.1.2.1.1.6
        type: DisplayString
