# spine1 — SNMP-only (no BGP, sFlow, or data-plane interfaces).
# Used by LAB_FABRIC_PROFILE=snmp-min / make alloy-snmp-min.

set / network-instance mgmt type ip-vrf
set / network-instance mgmt admin-state enable
set / network-instance mgmt interface mgmt0.0
set / network-instance mgmt protocols linux import-routes true
set / network-instance mgmt protocols linux export-routes true
set / network-instance mgmt protocols linux export-neighbors true

set / system snmp network-instance mgmt admin-state enable
set / system snmp access-group ag1 admin-state enable
set / system snmp access-group ag1 security-level no-auth-no-priv
set / system snmp access-group ag1 community-entry ce1 community public
