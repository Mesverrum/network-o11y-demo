apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: net-o11y-dns-internet-laptop
spec:
  job: net-o11y-dns-internet-laptop
  target: aws.amazon.com
  frequency: 120000
  timeout: 10000
  enabled: true
  labels:
    - name: project
      value: network-o11y-demo
    - name: check_type
      value: dns
    - name: direction
      value: laptop_to_aws
    - name: target_type
      value: internet
  probes:
    - network-o11y-laptop-wsl
  settings:
    dns:
      recordType: A
      server: "8.8.4.4"
      port: 53
      protocol: UDP
      ipVersion: V4
