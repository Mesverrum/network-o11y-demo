apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: net-o11y-internet-aws
spec:
  job: net-o11y-internet-aws
  target: https://aws.amazon.com/
  frequency: 60000
  timeout: 10000
  enabled: true
  labels:
    - name: project
      value: network-o11y-demo
    - name: target_type
      value: internet
  probes:
    - Ohio
    - NorthVirginia
    - network-o11y-colocated-ec2
    - network-o11y-laptop-wsl
  settings:
    http:
      method: GET
      # Prefer IPv4 — some private probes / dual-stack paths flake on AAAA.
      ipVersion: V4
      validStatusCodes: [200, 301, 302]
