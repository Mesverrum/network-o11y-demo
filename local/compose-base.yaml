# Local lab telemetry stack — KtransToGrafana golden path + Clos extras.
# Pattern: https://github.com/Mesverrum/KtransToGrafana
#
# Static services live here. Per-group SNMP pollers/discovery are rendered into
# compose-groups.generated.yaml; flow/sFlow/syslog catalog mounts into
# compose-catalog.generated.yaml — both from `make generate`.
#
# Requires ContainerLab so the external "clab" network exists.

name: srl-local-telemetry

services:
  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:latest}
    container_name: alloy
    restart: unless-stopped
    environment:
      - GC_OTLP_URL=${GC_OTLP_URL}
      - GC_OTLP_ACCOUNT=${GC_OTLP_ACCOUNT}
      - GC_OTLP_KEY=${GC_OTLP_KEY}
      # Optional second stack (dual-ship). Empty is fine when otlp-export.generated.alloy is single-sink.
      - GC_OTLP_URL_2=${GC_OTLP_URL_2:-}
      - GC_OTLP_ACCOUNT_2=${GC_OTLP_ACCOUNT_2:-}
      - GC_OTLP_KEY_2=${GC_OTLP_KEY_2:-}
      # Fleet Management remotecfg (LAB_ALLOY_FLEET=1). Set GC_FM_TOKEN or reuse GC_OTLP_KEY via alloy-fleet-up.
      - GC_FM_TOKEN=${GC_FM_TOKEN:-}
      - KTRANS_HOST=${KTRANS_HOST:-}
      # Fleet-shaped secret surface: community for snmp.yml auths (not in River text).
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}
      # Auth overlay (snmp_exporter auths: YAML). Empty → image library auths.
      - SNMP_AUTHS=${SNMP_AUTHS:-}
      - OTEL_METRIC_EXPORT_INTERVAL=1000
      # Stamped onto every signal so all telemetry from this host carries it.
      - OTEL_RESOURCE_ATTRIBUTES=deployment.host=${KTRANS_HOST}
    volumes:
      - ./alloy/config.alloy:/config/config.alloy:ro
      - ./alloy/otlp-export.generated.alloy:/config/otlp-export.generated.alloy:ro
      - ./alloy/snmp-scrape.generated.alloy:/config/snmp-scrape.generated.alloy:ro
      - ./alloy/snmp-trap.generated.alloy:/config/snmp-trap.generated.alloy:ro
      - ./alloy/netflow.generated.alloy:/config/netflow.generated.alloy:ro
      - ./alloy/remotecfg.generated.alloy:/config/remotecfg.generated.alloy:ro
      - ./alloy/snmp-network.yml:/etc/alloy/snmp-network.yml:ro
      - ./fixtures/alloy-snmp/mibs:/etc/alloy/mibs:ro
      - ./alloy/fingerprinters.yml:/etc/alloy/fingerprinters.yml:ro
      - ./alloy/snmp-discovery.yml:/etc/alloy/snmp-discovery.yml:ro
      - ./alloy/snmp-overrides.yml:/etc/alloy/snmp-overrides.yml:ro
      - ./alloy/snmp-targets.yml:/etc/alloy/snmp-targets.yml:ro
      - ./alloy/snmp-targets-cold.yml:/etc/alloy/snmp-targets-cold.yml:ro
      - ./alloy/snmp-targets-topology.yml:/etc/alloy/snmp-targets-topology.yml:ro
      # Lab container stdout/stderr → Loki via loki.source.docke
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # ICMP pre-filter for discovery.snmp (Fleet pipeline). Harmless when unused.
    cap_add:
      - NET_RAW
    ports:
      - "4317:4317"
      - "12346:12346"
      # otelcol.receiver.snmptrap (LAB_ALLOY_SNMPTRAP=1). Host map for trap-gen; SRL uses clab IP.
      - "1620:1620/udp"
      # loki.source.syslog (LAB_ALLOY_SYSLOG=1). Host 15140 avoids ktranslate_syslog :1514.
      - "15140:1514/udp"
      # otelcol.receiver.netflow (LAB_ALLOY_NETFLOW=1). Avoids ktranslate 9995 / 6343.
      - "12055:2055/udp"
      - "16344:6344/udp"
    # Alloy `run` accepts one path; a directory merges all *.alloy files in it.
    command:
      - --server.http.listen-addr=0.0.0.0:12346
      - --storage.path=/var/lib/alloy/data
      - --stability.level=experimental
      - run
      - /config
    networks:
      - clab
      - default

  # Prometheus-shaped SNMP Discoverer (overlay binary in srl-local/alloy:network-dev).
  # Writes snmp-targets.yml (laptop scrape path) and serves HTTP SD on :9780.
  # Default `make up` does not start this.
  snmp_discovery:
    profiles: [alloy-snmp]
    image: ${ALLOY_IMAGE:-srl-local/alloy:network-dev}
    container_name: snmp_discovery
    restart: unless-stopped
    user: "${SNMP_DISCOVERY_UID:-1000}:${SNMP_DISCOVERY_GID:-1000}"
    entrypoint: ["/usr/bin/snmp-discovery"]
    command:
      - --config=/etc/alloy/snmp-discovery.yml
      - --overrides=/etc/alloy/snmp-overrides.yml
      - --snmp-config=/etc/alloy/snmp-network.yml
      - --fingerprinters=/etc/alloy/fingerprinters.yml
      - --out-alloy=/out/snmp-targets.yml
      - --out-file-sd=/out/snmp-file-sd.json
      - --interval=${ALLOY_SNMP_INTERVAL:-5m}
      - --misses=${ALLOY_SNMP_MISSES:-3}
      - --state=/out/snmp-discovery.state.json
      - --listen=:9780
    cap_add:
      - NET_RAW
    ports:
      - "9780:9780"
    volumes:
      - ./alloy/snmp-discovery.yml:/etc/alloy/snmp-discovery.yml:ro
      - ./alloy/snmp-overrides.yml:/etc/alloy/snmp-overrides.yml:ro
      - ./alloy/snmp-network.yml:/etc/alloy/snmp-network.yml:ro
      - ./alloy/fingerprinters.yml:/etc/alloy/fingerprinters.yml:ro
      - ./alloy:/out
    networks:
      - clab
      - default

  gnmic:
    image: ${GNMIC_IMAGE:-ghcr.io/openconfig/gnmic:latest}
    container_name: gnmic
    restart: unless-stopped
    depends_on:
      - alloy
    volumes:
      - ./gnmic/gnmic.yaml:/app/gnmic.yaml:ro
    command:
      - --config
      - /app/gnmic.yaml
      - subscribe
    networks:
      - clab
      - default

  # Split-horizon DNS for ktranslate --dns (src_host / dst_host on NetFlow rollups).
  flow_dns:
    image: ${FLOW_DNS_IMAGE:-andyshinn/dnsmasq:2.83}
    container_name: flow_dns
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./dnsmasq/hosts.generated.conf:/etc/dnsmasq.d/hosts.generated.conf:ro
      - ./dnsmasq/upstream.conf:/etc/dnsmasq.d/upstream.conf:ro
      - ./dnsmasq/extra-hosts.conf:/etc/dnsmasq.d/extra-hosts.conf:ro
    networks:
      - clab
      - default

  ktranslate_flow:
    image: ${KTRANSLATE_IMAGE:-quay.io/kentik/ktranslate:latest}
    container_name: ktranslate_flow
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=ktranslate-flow${KTRANS_HOST:+-}${KTRANS_HOST}
      - OTEL_EXPORTER_OTLP_COMPRESSION=${OTEL_EXPORTER_OTLP_COMPRESSION:-gzip}
    # config/catalog.yaml + state/devices-*.yaml mounts: compose-catalog.generated.yaml
    depends_on:
      - alloy
      - flow_dns
    command:
      - --format=otel
      - --format_metric=otel
      - --otel.protocol=grpc
      - --otel.endpoint=http://alloy:4317/
      - --snmp=/snmp.yaml
      - --flow_only=true
      - --nf.source=${NF_SOURCE:-netflow9}
      - --nf.port=9995
      - --metalisten=0.0.0.0:9996
      - --dns=${FLOW_DNS:-flow_dns:53}
      - --sinks=otel
      - --metrics=jchf
      - --tee_logs=true
      - --service_name=flow
      - --max_flows_per_message=100
      - --rollup_interval=60
      - --rollup_top_k=100
      - --rollups=s_sum,bytes_by_flow,in_bytes+out_bytes,src_addr,dst_addr,l4_src_port,l4_dst_port,protocol,custom_str.application,device_name,custom_str.src_host,custom_str.dst_host,src_geo,dst_geo
      - --rollup_keep_undefined=true
    ports:
      - "9995:9995/udp"
      - "9996:9996"
    networks:
      - clab
      - default

  ktranslate_sflow:
    image: ${KTRANSLATE_IMAGE:-quay.io/kentik/ktranslate:latest}
    container_name: ktranslate_sflow
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=ktranslate-sflow${KTRANS_HOST:+-}${KTRANS_HOST}
      - OTEL_EXPORTER_OTLP_COMPRESSION=${OTEL_EXPORTER_OTLP_COMPRESSION:-gzip}
    # catalog volumes: compose-catalog.generated.yaml
    depends_on:
      - alloy
      - flow_dns
    command:
      - --format=otel
      - --format_metric=otel
      - --otel.protocol=grpc
      - --otel.endpoint=http://alloy:4317/
      - --snmp=/snmp.yaml
      - --flow_only=true
      - --nf.source=sflow
      - --nf.port=6343
      - --metalisten=0.0.0.0:9994
      - --dns=${FLOW_DNS:-flow_dns:53}
      - --sinks=otel
      - --metrics=jchf
      - --tee_logs=true
      - --service_name=flow-sflow
      - --max_flows_per_message=100
      - --rollup_interval=60
      - --rollup_top_k=100
      - --rollups=s_sum,bytes_by_flow,in_bytes+out_bytes,src_addr,dst_addr,l4_src_port,l4_dst_port,protocol,custom_str.application,device_name,custom_str.src_host,custom_str.dst_host,src_geo,dst_geo
      - --rollup_keep_undefined=true
    ports:
      - "6343:6343/udp"
      - "9994:9994"
    networks:
      - clab
      - default

  ktranslate_syslog:
    image: ${KTRANSLATE_IMAGE:-quay.io/kentik/ktranslate:latest}
    container_name: ktranslate_syslog
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=ktranslate-syslog${KTRANS_HOST:+-}${KTRANS_HOST}
      - OTEL_EXPORTER_OTLP_COMPRESSION=${OTEL_EXPORTER_OTLP_COMPRESSION:-gzip}
    # catalog volumes: compose-catalog.generated.yaml
    depends_on:
      - alloy
    command:
      - --format=otel
      - --format_metric=otel
      - --otel.protocol=grpc
      - --otel.endpoint=http://alloy:4317/
      - --snmp=/snmp.yaml
      - --flow_only=true
      - --syslog.source=${SYSLOG_SOURCE:-0.0.0.0:1514}
      - --metalisten=0.0.0.0:9998
      - --sinks=otel
      - --metrics=jchf
      - --tee_logs=true
      - --service_name=syslog
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
      - "9998:9998"
    networks:
      - clab
      - default

  topology_exporter:
    profiles: [topology]
    image: ${TOPOLOGY_EXPORTER_IMAGE:-srl-local/network-topology-exporter:v1.0.0}
    container_name: topology_exporte
    restart: unless-stopped
    environment:
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}
    volumes:
      - ./topology-exporter/config.yaml:/etc/topology-exporter/config.yaml:ro
      - topology_exporter_data:/var/lib/network-topology-exporte
    depends_on:
      - alloy
    command:
      - --config.file=/etc/topology-exporter/config.yaml
    ports:
      - "9100:9100"
    networks:
      - clab
      - default

volumes:
  topology_exporter_data:

networks:
  clab:
    external: true
    name: ${CLAB_NETWORK:-clab}
  default:
    name: srl-local-telemetry
