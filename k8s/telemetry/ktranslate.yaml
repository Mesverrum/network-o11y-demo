---
# ktranslate NetFlow receiver — same role as local ktranslate_flow.
# softflowd on client pods sends NetFlow v9 here (simulator limitation).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ktranslate-flow
  namespace: network-lab
  labels:
    app: ktranslate-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ktranslate-flow
  template:
    metadata:
      labels:
        app: ktranslate-flow
    spec:
      containers:
        - name: ktranslate
          image: quay.io/kentik/ktranslate:v2
          env:
            - name: OTEL_SERVICE_NAME
              value: ktranslate-flow
          args:
            - "--format=otel"
            - "--format_metric=otel"
            - "--otel.protocol=grpc"
            # Alloy's OTLP gRPC endpoint (same namespace)
            - "--otel.endpoint=http://alloy.network-lab.svc.cluster.local:4317"
            - "--snmp=/etc/ktranslate/poller.yaml"
            - "--flow_only=true"
            - "--metalisten=0.0.0.0:9996"
            - "--sinks=otel"
            - "--metrics=jchf"
            # NetFlow v9 reception from softflowd on client nodes — port 6343
            - "--nf.source=netflow9"
            - "--nf.port=9995"
            - "--rollup_interval=60"
            - "--tee_logs=true"
            - "--service_name=flow"
            - "--max_flows_per_message=100"
            # Roll up bytes per flow with key dimensions for Grafana dashboards
            - "--rollups=s_sum,bytes_by_flow,in_bytes+out_bytes,src_addr,dst_addr,l4_src_port,l4_dst_port,protocol,device_name"
            - "--rollup_top_k=20"
            - "--rollup_keep_undefined=true"
          ports:
            - name: netflow
              containerPort: 9995
              protocol: UDP
            - name: meta
              containerPort: 9996
              protocol: TCP
          securityContext:
            capabilities:
              add: ["NET_RAW"]
          volumeMounts:
            - name: poller-config
              mountPath: /etc/ktranslate/poller.yaml
              subPath: poller.yaml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: poller-config
          configMap:
            name: ktranslate-snmp-poller

---
# ClusterIP Service — softflowd on client nodes sends NetFlow v9 here
apiVersion: v1
kind: Service
metadata:
  name: ktranslate-flow
  namespace: network-lab
  labels:
    app: ktranslate-flow
spec:
  selector:
    app: ktranslate-flow
  ports:
    - name: netflow
      port: 9995
      protocol: UDP
      targetPort: 9995
