---
# ktranslate sFlow receiver — same role as local ktranslate_sflow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ktranslate-sflow
  namespace: network-lab
  labels:
    app: ktranslate-sflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ktranslate-sflow
  template:
    metadata:
      labels:
        app: ktranslate-sflow
    spec:
      containers:
        - name: ktranslate
          image: quay.io/kentik/ktranslate:v2
          args:
            - "--format=otel"
            - "--format_metric=otel"
            - "--otel.protocol=grpc"
            - "--otel.endpoint=http://alloy.network-lab.svc.cluster.local:4317"
            - "--snmp=/etc/ktranslate/poller.yaml"
            - "--nf.source=sflow"
            - "--nf.port=6343"
            - "--metalisten=0.0.0.0:9994"
            - "--sinks=otel"
            - "--metrics=jchf"
            - "--tee_logs=true"
            - "--service_name=flow-sflow"
            - "--flow_only=true"
            - "--rollup_interval=60"
            - "--rollup_top_k=100"
            - "--rollups=s_sum,bytes_by_flow,in_bytes+out_bytes,src_addr,dst_addr,l4_src_port,l4_dst_port,protocol,device_name"
            - "--rollup_keep_undefined=true"
          ports:
            - name: sflow
              containerPort: 6343
              protocol: UDP
            - name: meta
              containerPort: 9994
              protocol: TCP
          securityContext:
            capabilities:
              add: ["NET_RAW"]
          volumeMounts:
            - name: poller-config
              mountPath: /etc/ktranslate/poller.yaml
              subPath: poller.yaml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: poller-config
          configMap:
            name: ktranslate-snmp-poller

---
apiVersion: v1
kind: Service
metadata:
  name: ktranslate-sflow
  namespace: network-lab
  labels:
    app: ktranslate-sflow
spec:
  selector:
    app: ktranslate-sflow
  ports:
    - name: sflow
      port: 6343
      protocol: UDP
      targetPort: 6343
