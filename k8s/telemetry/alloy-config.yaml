---
# Grafana Alloy — OTLP forwarder for the unified ktranslate model.
# Receives OTLP from all ktranslate instances (+ gnmic when switched to OTLP).
# SNMP and syslog are collected by ktranslate, not Alloy.
#
# Credentials: grafana-cloud-credentials Secret.

apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: network-lab
data:
  config.alloy: |
    // ─── OTLP from ktranslate (SNMP / flow / sFlow / syslog) ───────────────────

    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
        max_recv_msg_size = "128MiB"
      }
      output {
        metrics = [otelcol.processor.transform.preprocessing.input]
        logs    = [otelcol.processor.batch.otlp.input]
      }
    }

    // Flow rollups: semconv rename + integration datapoint label (not resource.service.name).
    otelcol.processor.transform "preprocessing" {
      error_mode = "ignore"

      metric_statements {
        context = "metric"
        statements = [
          `set(metric.name,"network.io.by_flow") where metric.name == "kentik.rollup.bytes_by_flow"`,
          `set(metric.unit,"By") where metric.name == "network.io.by_flow"`,
        ]
      }

      metric_statements {
        context = "datapoint"
        statements = [
          `set(datapoint.attributes["integration"],"ktranslate-netflow") where metric.name == "network.io.by_flow"`,
          `set(datapoint.attributes["device_role"],"spine") where IsMatch(metric.name,"kentik_snmp_.*") and IsMatch(datapoint.attributes["device_name"],"spine.*")`,
          `set(datapoint.attributes["device_role"],"branch-edge") where IsMatch(metric.name,"kentik_snmp_.*") and IsMatch(datapoint.attributes["device_name"],"leaf-br.*")`,
          `set(datapoint.attributes["device_role"],"leaf") where IsMatch(metric.name,"kentik_snmp_.*") and IsMatch(datapoint.attributes["device_name"],"^leaf[0-9]+$")`,
          `set(datapoint.attributes["site"],"hq") where IsMatch(metric.name,"kentik_snmp_.*") and IsMatch(datapoint.attributes["device_name"],"^(spine1|leaf1|leaf2)$")`,
          `set(datapoint.attributes["site"],"branch1") where IsMatch(metric.name,"kentik_snmp_.*") and IsMatch(datapoint.attributes["device_name"],"leaf-br1")`,
          `set(datapoint.attributes["site"],"branch2") where IsMatch(metric.name,"kentik_snmp_.*") and IsMatch(datapoint.attributes["device_name"],"leaf-br2")`,
          `set(datapoint.attributes["platform"],"sr-linux") where IsMatch(metric.name,"kentik_snmp_.*")`,
          `set(datapoint.attributes["tenant"],"network-o11y-demo") where IsMatch(metric.name,"kentik_snmp_.*")`,
          `set(datapoint.attributes["network.transport"],datapoint.attributes["protocol"]) where metric.name == "network.io.by_flow"`,
          `delete_key(datapoint.attributes,"protocol") where metric.name == "network.io.by_flow"`,
          `set(datapoint.attributes["network.local.address"],datapoint.attributes["src_addr"]) where metric.name == "network.io.by_flow"`,
          `delete_key(datapoint.attributes,"src_addr") where metric.name == "network.io.by_flow"`,
          `set(datapoint.attributes["network.local.port"],datapoint.attributes["src_port"]) where metric.name == "network.io.by_flow"`,
          `delete_key(datapoint.attributes,"src_port") where metric.name == "network.io.by_flow"`,
          `set(datapoint.attributes["network.peer.address"],datapoint.attributes["dst_addr"]) where metric.name == "network.io.by_flow"`,
          `delete_key(datapoint.attributes,"dst_addr") where metric.name == "network.io.by_flow"`,
          `set(datapoint.attributes["network.peer.port"],datapoint.attributes["dst_port"]) where metric.name == "network.io.by_flow"`,
          `delete_key(datapoint.attributes,"dst_port") where metric.name == "network.io.by_flow"`,
        ]
      }

      output {
        metrics = [otelcol.processor.batch.otlp.input]
      }
    }

    // ─── gNMI via gnmic (Prometheus scrape until gnmic → OTLP migration) ─────────

    prometheus.scrape "gnmic" {
      targets         = [{"__address__" = "gnmic.network-lab.svc.cluster.local:9273"}]
      forward_to      = [prometheus.relabel.netbox_enrich_gnmi.receiver]
      job_name        = "integrations/gnmi"
      scrape_interval = "30s"
      scrape_timeout  = "25s"
    }

    prometheus.relabel "netbox_enrich_gnmi" {
      forward_to = [prometheus.remote_write.grafana_cloud.receiver]

      rule {
        source_labels = ["source"]
        target_label  = "device"
      }
      rule {
        source_labels = ["source"]
        regex         = "spine[12]"
        target_label  = "device_role"
        replacement   = "spine"
      }
      rule {
        source_labels = ["source"]
        regex         = "leaf[123]"
        target_label  = "device_role"
        replacement   = "leaf"
      }
      rule {
        source_labels = ["source"]
        regex         = "spine[12]|leaf[123]"
        target_label  = "site"
        replacement   = "network-lab"
      }
      rule {
        source_labels = ["source"]
        regex         = "spine[12]|leaf[123]"
        target_label  = "platform"
        replacement   = "sr-linux"
      }
    }

    // ─── Pod logs (skip ktranslate — they tee logs over OTLP) ────────────────────

    discovery.kubernetes "network_lab_pods" {
      role = "pod"
      namespaces { names = ["network-lab"] }
    }

    discovery.relabel "network_lab_pods" {
      targets = discovery.kubernetes.network_lab_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "ktranslate.*"
        action        = "drop"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "network_lab" {
      targets    = discovery.relabel.network_lab_pods.output
      forward_to = [loki.write.grafana_cloud.receiver]
    }

    loki.write "grafana_cloud" {
      endpoint {
        url = env("GC_LOKI_ENDPOINT") + "/loki/api/v1/push"
        basic_auth {
          username = env("GC_LOKI_USERNAME")
          password = env("API_TOKEN")
        }
      }
    }

    // ─── Export ──────────────────────────────────────────────────────────────────

    otelcol.processor.batch "otlp" {
      output {
        metrics = [otelcol.exporter.otlphttp.grafana_cloud.input]
        logs    = [otelcol.exporter.otlphttp.grafana_cloud.input]
      }
    }

    otelcol.exporter.otlphttp "grafana_cloud" {
      client {
        endpoint = env("GC_OTLP_ENDPOINT")
        auth     = otelcol.auth.basic.otlp.handler
      }
    }

    otelcol.auth.basic "otlp" {
      username = env("GC_OTLP_USERNAME")
      password = env("API_TOKEN")
    }

    prometheus.remote_write "grafana_cloud" {
      endpoint {
        url = env("GC_PROM_ENDPOINT")
        basic_auth {
          username = env("GC_PROM_USERNAME")
          password = env("API_TOKEN")
        }
      }
    }
