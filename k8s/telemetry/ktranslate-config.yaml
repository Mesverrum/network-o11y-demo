---
# ktranslate SNMP poller config for the EKS fabric (static device list).
# Same device list and metric names as local/groups/srl-hq.env golden path.
# SNMP profiles come from the ktranslate image (kentik/snmp-profiles).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ktranslate-snmp-poller
  namespace: network-lab
data:
  poller.yaml: |
    devices:
      spine1:
        device_name: spine1
        device_ip: spine1-telemetry.network-lab.svc.cluster.local
        snmp_comm: public
        snmp_port: 161
        mib_profile: nokia-srlinux.yml
      spine2:
        device_name: spine2
        device_ip: spine2-telemetry.network-lab.svc.cluster.local
        snmp_comm: public
        snmp_port: 161
        mib_profile: nokia-srlinux.yml
      leaf1:
        device_name: leaf1
        device_ip: leaf1-telemetry.network-lab.svc.cluster.local
        snmp_comm: public
        snmp_port: 161
        mib_profile: nokia-srlinux.yml
      leaf2:
        device_name: leaf2
        device_ip: leaf2-telemetry.network-lab.svc.cluster.local
        snmp_comm: public
        snmp_port: 161
        mib_profile: nokia-srlinux.yml
      leaf3:
        device_name: leaf3
        device_ip: leaf3-telemetry.network-lab.svc.cluster.local
        snmp_comm: public
        snmp_port: 161
        mib_profile: nokia-srlinux.yml
    trap:
      listen: 0.0.0.0:1620
      community: public
      version: ""
      transport: ""
      v3_config: null
      trap_only: false
      drop_undefined: false
      endpoint: ""
      endpoint_port: 0
    discovery:
      cidrs: []
      ignore_list: []
      debug: false
      ports:
        - 161
      default_communities:
        - public
      use_snmp_v1: false
      default_v3: null
      add_devices: false
      add_mibs: false
      threads: 4
      replace_devices: false
      kentik: null
      no_use_bulkwalkall: false
    global:
      poll_time_sec: 60
      drop_if_outside_poll: false
      mib_profile_dir: /etc/ktranslate/profiles
      mibs_db: ""
      mibs_enabled:
        - IF-MIB
        - TIMETRA-SYSTEM-MIB
        - TIMETRA-CHASSIS-MIB
        - TIMETRA-BGP-MIB
      timeout_ms: 10000
      retries: 1
      global_v3: null
      response_time: true
      purge_devices_after_num: 0
      no_device_hardcoded_oids: false
      user_tags: {}
      match_attributes: {}
      providers: {}
      jitter_time_sec: 30
      fast_poll: false
      watch_profile_changes: false
      save_mds_cache: false
